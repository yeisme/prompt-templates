# Initial project-owned scaffold from Yeisme modular CI rollout.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run quick gate
        shell: bash
        run: |
          set -euo pipefail
          jq empty catalog.json repository.json
          find . -name solution.json -print0 | xargs -0 -r -n1 jq empty
