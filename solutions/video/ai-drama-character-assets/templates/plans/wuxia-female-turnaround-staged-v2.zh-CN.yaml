schema_version: eikona.character_asset_prompt_modules.v1
plan_id: wuxia-female-turnaround-staged-v2
asset_profile_id: turnaround-three-view-v1
locale: zh-CN
output_schema_version: character_asset.prompt_bundle.v1
module_refs:
  character: promptrepo://official/video/ai-drama-character-assets@1.0.0?kind=template&locale=zh-CN&role=character-wuxia-female-v1
  wardrobe: promptrepo://official/video/ai-drama-character-assets@1.0.0?kind=template&locale=zh-CN&role=wardrobe-wuxia-hanfu-moonwhite-v1
  task: promptrepo://official/video/ai-drama-character-assets@1.0.0?kind=template&locale=zh-CN&role=task-character-turnaround-independent-artifacts-v2
  qc: promptrepo://official/video/ai-drama-character-assets@1.0.0?kind=template&locale=zh-CN&role=qc-character-turnaround-production-v1
production_order:
  - face-master-front
  - expression-sheet-face-only
  - body-master-front
  - base-wardrobe-front
  - turnaround-left-profile
  - turnaround-back
  - turnaround-contact-sheet-review-projection
reference_binding_policy:
  identity_source:
    inherit:
      - face_geometry
      - skin_marker
      - hairline
      - base_hairstyle_silhouette
    forbid:
      - expression
      - makeup
      - wardrobe
      - background
  wardrobe_source:
    inherit:
      - silhouette
      - layer_order
      - seams
      - materials
      - color_placement
    forbid:
      - face
      - hairline
      - expression
      - body_identity
review_policy:
  each_provider_job_has_one_view: true
  contact_sheet_is_not_canonical_asset: true
  derived_view_requires_accepted_front: true
